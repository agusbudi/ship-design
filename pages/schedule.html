<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>P445 Delivery Schedule — ShipDesign</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .sch-wrap { padding: 14px 24px 32px; }

    .sch-toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .sch-search {
      font-size:13px; padding:7px 11px; border-radius:var(--radius-md);
      border:0.5px solid var(--border-mid); background:var(--bg-primary);
      color:var(--text-primary); font-family:var(--font); width:240px;
    }
    .sch-search:focus { outline:none; border-color:var(--blue-600); }
    .sch-select {
      font-size:13px; padding:7px 10px; border-radius:var(--radius-md);
      border:0.5px solid var(--border-mid); background:var(--bg-primary);
      color:var(--text-primary); cursor:pointer; font-family:var(--font);
    }
    .sch-pill {
      font-size:12px; padding:5px 12px; border-radius:20px;
      border:0.5px solid var(--border-mid); background:var(--bg-primary);
      color:var(--text-secondary); cursor:pointer; font-family:var(--font);
    }
    .sch-pill:hover  { background:var(--bg-secondary); }
    .sch-pill.active { background:var(--blue-600); color:#fff; border-color:var(--blue-600); }
    .sch-count { margin-left:auto; font-size:12px; color:var(--text-tertiary); }

    .sch-stats { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .sch-stat {
      flex:1; min-width:120px; background:var(--bg-primary);
      border:0.5px solid var(--border-light); border-radius:var(--radius-lg);
      padding:12px 14px;
    }
    .sch-stat-num { font-size:20px; font-weight:500; color:var(--text-primary); line-height:1.2; }
    .sch-stat-lbl { font-size:11px; color:var(--text-tertiary); margin-top:2px; }

    .sch-table-wrap {
      background:var(--bg-primary); border:0.5px solid var(--border-light);
      border-radius:var(--radius-lg); overflow:hidden;
    }
    table.sch-table { width:100%; border-collapse:collapse; font-size:13px; }
    .sch-table thead th {
      text-align:left; font-size:11px; font-weight:500; color:var(--text-tertiary);
      text-transform:uppercase; letter-spacing:.04em;
      padding:9px 12px; border-bottom:0.5px solid var(--border-light);
      background:var(--bg-secondary); white-space:nowrap; position:sticky; top:0;
      cursor:pointer; user-select:none;
    }
    .sch-table thead th:hover { color:var(--text-primary); }
    .sch-table thead th.sorted { color:var(--blue-600); }
    .sch-table tbody td {
      padding:8px 12px; border-bottom:0.5px solid var(--border-light);
      vertical-align:top;
    }
    .sch-table tbody tr:last-child td { border-bottom:none; }
    .sch-table tbody tr:hover { background:var(--bg-secondary); }
    .sch-table tbody tr.received { background:var(--green-50); }
    .sch-table tbody tr.received:hover { background:var(--green-50); filter:brightness(0.98); }
    .sch-code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; color:var(--text-secondary); white-space:nowrap; }
    .sch-title { font-weight:500; color:var(--text-primary); }
    .sch-sub   { font-size:11px; color:var(--text-tertiary); margin-top:1px; }
    .sch-nowrap { white-space:nowrap; }
    .sch-ph {
      font-size:11px; padding:2px 8px; border-radius:6px; font-weight:500; white-space:nowrap;
    }
    .sch-empty { padding:40px 20px; text-align:center; color:var(--text-tertiary); font-size:13px; }
    .sch-recv-chk { width:16px; height:16px; cursor:pointer; accent-color: var(--green-600); }

    /* ---- S-curve card ---- */
    .viz-root {
      color-scheme: light;
      --surface-1:      #fcfcfb;
      --text-primary:   #0b0b0b;
      --text-secondary: #52514e;
      --text-muted:     #898781;
      --series-plan:    #2a78d6;
      --series-act:     #eb6834;
      --grid-line:      #e1e0d9;
      --baseline:       #c3c2b7;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) .viz-root {
        color-scheme: dark;
        --surface-1:      #1a1a19;
        --text-primary:   #f0efec;
        --text-secondary: #c3c2b7;
        --text-muted:     #898781;
        --series-plan:    #3987e5;
        --series-act:     #d95926;
        --grid-line:      #2c2c2a;
        --baseline:       #383835;
      }
    }
    :root[data-theme="dark"] .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --text-primary:   #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --series-plan:    #3987e5;
      --series-act:     #d95926;
      --grid-line:      #2c2c2a;
      --baseline:       #383835;
    }

    .scurve-card {
      background:var(--surface-1); border:0.5px solid var(--border-light);
      border-radius:var(--radius-lg); padding:18px 20px 10px; margin-bottom:16px;
    }
    .scurve-hd { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:6px; flex-wrap:wrap; }
    .scurve-title { font-size:14px; font-weight:500; color:var(--text-primary); }
    .scurve-sub   { font-size:12px; color:var(--text-muted); margin-top:2px; }
    .scurve-hero  { text-align:right; }
    .scurve-hero-num { font-size:28px; font-weight:500; color:var(--text-primary); line-height:1.1; }
    .scurve-hero-lbl { font-size:11px; color:var(--text-muted); margin-top:2px; }
    .scurve-hero-delta { font-size:12px; margin-top:3px; font-weight:500; }
    .scurve-legend { display:flex; gap:16px; margin:4px 0 6px; flex-wrap:wrap; }
    .scurve-lgd-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
    .scurve-lgd-line { width:16px; height:2px; border-radius:1px; flex-shrink:0; }
    .scurve-svg-wrap { position:relative; }
    .scurve-tooltip {
      position:absolute; pointer-events:none; background:var(--surface-1);
      border:0.5px solid var(--border-mid); border-radius:var(--radius-md);
      padding:8px 10px; font-size:12px; box-shadow:0 2px 10px rgba(0,0,0,.12);
      transform:translate(-50%,-110%); white-space:nowrap; opacity:0; transition:opacity .08s;
      z-index:20;
    }
    .scurve-tooltip.show { opacity:1; }
    .scurve-tt-date { color:var(--text-muted); font-size:11px; margin-bottom:4px; }
    .scurve-tt-row { display:flex; align-items:center; gap:6px; }
    .scurve-tt-key { width:10px; height:2px; border-radius:1px; flex-shrink:0; }
    .scurve-tt-val { font-weight:600; color:var(--text-primary); margin-left:auto; padding-left:10px; }
    .scurve-tt-name { color:var(--text-secondary); }
  </style>
</head>

  <div class="sch-stats" id="sch-stats"></div>

    <span class="sch-count" id="sch-count"></span>
  </div>

  <div class="sch-table-wrap">
    <table class="sch-table">
      <thead>
        <tr>

          <th data-key="end">End</th>

      </thead>
      <tbody id="sch-tbody"></tbody>
    </table>
  </div>

</div>

/* ---- Received tracking (persisted) ---- */
function getReceived() {
  try { const s = localStorage.getItem('sd_p445_received'); return s ? JSON.parse(s) : {}; } catch(e) { return {}; }
}
function saveReceived(r) { try { localStorage.setItem('sd_p445_received', JSON.stringify(r)); } catch(e) {} }
function toggleReceived(no) {
  const r = getReceived();
  r[no] = !r[no];
  saveReceived(r);
  renderTable();
  renderSCurve();
  renderStats();
}

let schPhase = 'all';

function setPhase(p, btn) {
  schPhase = p;
  document.querySelectorAll('.sch-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

(function initDisciplines(){
  const sel = document.getElementById('sch-discipline');
  const disciplines = [...new Set(SCHEDULE_DATA.map(r=>r.discipline))].sort();
  disciplines.forEach(d=>{
    const o = document.createElement('option');
    o.value = d; o.textContent = d;
    sel.appendChild(o);
  });
})();

function renderStats() {
  const received = getReceived();
  const total   = SCHEDULE_DATA.length;
  const dated   = SCHEDULE_DATA.filter(r=>r.week).length;
  const undated = total - dated;
  const done    = SCHEDULE_DATA.filter(r=>received[r.no]).length;
  const byPhase = { C:0, P:0, B:0 };
  SCHEDULE_DATA.forEach(r=>{ if(byPhase[r.phase]!==undefined) byPhase[r.phase]++; });

  document.getElementById('sch-stats').innerHTML = `
    <div class="sch-stat"><div class="sch-stat-num">${total}</div><div class="sch-stat-lbl">Total dokumen</div></div>
    <div class="sch-stat"><div class="sch-stat-num" style="color:${PHASES.concept.color}">${byPhase.C}</div><div class="sch-stat-lbl">Conceptual</div></div>
    <div class="sch-stat"><div class="sch-stat-num" style="color:${PHASES.preliminary.color}">${byPhase.P}</div><div class="sch-stat-lbl">Preliminary</div></div>
    <div class="sch-stat"><div class="sch-stat-num" style="color:${PHASES.contract.color}">${byPhase.B}</div><div class="sch-stat-lbl">Basic</div></div>
    <div class="sch-stat"><div class="sch-stat-num">${dated}</div><div class="sch-stat-lbl">Terjadwal (dated)</div></div>
    <div class="sch-stat"><div class="sch-stat-num" style="color:var(--green-600)">${done}/${total}</div><div class="sch-stat-lbl">Diterima (capaian)</div></div>`;
}

let sortKey = 'no', sortDir = 1;
function sortBy(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  renderTable();
}
document.querySelectorAll('.sch-table thead th[data-key]').forEach(th=>{
  th.onclick = () => sortBy(th.dataset.key);
});

function renderTable() {
  const q        = document.getElementById('sch-search').value.trim().toLowerCase();
  const disc     = document.getElementById('sch-discipline').value;
  const received = getReceived();

  let rows = SCHEDULE_DATA.filter(r => {
    if (schPhase !== 'all' && r.phase !== schPhase) return false;
    if (disc !== 'all' && r.discipline !== disc) return false;
    if (q && !(r.title.toLowerCase().includes(q) || String(r.code).toLowerCase().includes(q))) return false;
    return true;
  });

  rows = [...rows].sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (av == null) av = '';
    if (bv == null) bv = '';
    if (typeof av === 'number' && typeof bv === 'number') return (av-bv)*sortDir;
    return String(av).localeCompare(String(bv)) * sortDir;
  });

  document.querySelectorAll('.sch-table thead th[data-key]').forEach(th=>{
    th.classList.toggle('sorted', th.dataset.key===sortKey);
  });

  const tbody = document.getElementById('sch-tbody');
  document.getElementById('sch-count').textContent = `${rows.length} / ${SCHEDULE_DATA.length} dokumen`;

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="10"><div class="sch-empty">Tidak ada dokumen yang cocok dengan filter.</div></td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(r => {
    const ph = SCH_PHASE_CFG[r.phase] || { label:r.phase_name, bg:'var(--bg-secondary)', tc:'var(--text-tertiary)' };
    const isRecv = !!received[r.no];
    return `<tr class="${isRecv?'received':''}">
      <td><input type="checkbox" class="sch-recv-chk" ${isRecv?'checked':''} title="Tandai diterima" onchange="toggleReceived(${r.no})"></td>
      <td class="sch-nowrap">${r.no}</td>
      <td class="sch-code">${r.code}</td>
      <td>
        <div class="sch-title">${r.title}</div>
        ${r.remarks ? `<div class="sch-sub">${r.remarks}</div>` : ''}
      </td>
      <td>${r.discipline}</td>
      <td><span class="sch-ph" style="background:${ph.bg};color:${ph.tc}">${ph.label}</span></td>
      <td class="sch-nowrap">${r.issue}</td>
      <td class="sch-nowrap">${r.week ?? '—'}</td>
      <td class="sch-nowrap">${r.start || '<span style="color:var(--text-tertiary)">TBD</span>'}</td>
      <td class="sch-nowrap">${r.end || '<span style="color:var(--text-tertiary)">TBD</span>'}</td>
    </tr>`;
  }).join('');
}

/* ================================================================
   S-CURVE — cumulative planned vs actual % by ISO week
   ================================================================ */
function buildActualSeries() {
  const received = getReceived();
  /* cumulative actual count, credited to each document's own planned week
     (undated / unreceived documents never contribute) */
  const countByWeek = {};
  SCHEDULE_DATA.forEach(r => {
    if (received[r.no] && r.week) countByWeek[r.week] = (countByWeek[r.week]||0) + 1;
  });
  let running = 0;
  const totalDocs = SCHEDULE_DATA.length;
  return WEEKLY_PLAN.map(w => {
    running += countByWeek[w.week] || 0;
    return { week:w.week, start:w.start, end:w.end, cum:running, pct: totalDocs ? (running/totalDocs*100) : 0 };
  });
}

function fmtDateShort(iso) {
  if (!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});
}

function renderSCurve() {
  const wrap = document.getElementById('scurve-svg-wrap');
  const W = Math.max(wrap.clientWidth || 860, 320);
  const H = 240;
  const padL = 34, padR = 14, padT = 14, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const planned = WEEKLY_PLAN;
  const actual  = buildActualSeries();
  const n = planned.length;

  const x = i => padL + (plotW * i / (n-1));
  const y = pct => padT + plotH - (plotH * pct/100);

  const linePath = series => series.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.pct ?? p.cumPct).toFixed(1)}`).join(' ');
  const areaPath = series => linePath(series) + ` L${x(n-1).toFixed(1)},${y(0).toFixed(1)} L${x(0).toFixed(1)},${y(0).toFixed(1)} Z`;

  /* gridlines at 0/25/50/75/100% */
  const grid = [0,25,50,75,100].map(v => `
    <line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}" stroke="var(--grid-line)" stroke-width="1"/>
    <text x="${padL-8}" y="${(y(v)+3).toFixed(1)}" font-size="10" fill="var(--text-muted)" text-anchor="end">${v}%</text>`).join('');

  /* month ticks: first week of each shown month */
  const monthTicks = [];
  let lastMonth = null;
  planned.forEach((w,i) => {
    const m = w.start ? w.start.slice(0,7) : null;
    if (m && m !== lastMonth) { monthTicks.push({i, label: fmtDateShort(w.start)}); lastMonth = m; }
  });
  const xAxis = monthTicks.map(t => `<text x="${x(t.i).toFixed(1)}" y="${H-8}" font-size="10" fill="var(--text-muted)" text-anchor="middle">${t.label}</text>`).join('');

  const planPct = planned.map(w=>w.cumPct);
  const actPct  = actual.map(a=>a.pct);

  const hitDots = planned.map((w,i) => `<circle class="sc-hit" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(planPct[i]).toFixed(1)}" r="12" fill="transparent"/>`).join('');

  wrap.innerHTML = `
    <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" id="sc-svg" style="display:block;overflow:visible">
      ${grid}
      <line x1="${padL}" y1="${y(0)}" x2="${W-padR}" y2="${y(0)}" stroke="var(--baseline)" stroke-width="1"/>
      ${xAxis}
      <path d="${areaPath(planned.map((w,i)=>({pct:planPct[i]})))}" fill="var(--series-plan)" opacity="0.08" stroke="none"/>
      <path d="${linePath(planned.map((w,i)=>({pct:planPct[i]})))}" fill="none" stroke="var(--series-plan)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${linePath(actual.map(a=>({pct:a.pct})))}" fill="none" stroke="var(--series-act)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(n-1)}" cy="${y(planPct[n-1])}" r="4" fill="var(--series-plan)" stroke="var(--surface-1)" stroke-width="2"/>
      <circle cx="${x(n-1)}" cy="${y(actPct[n-1])}" r="4" fill="var(--series-act)" stroke="var(--surface-1)" stroke-width="2"/>
      <line id="sc-crosshair" x1="0" y1="${padT}" x2="0" y2="${H-padB}" stroke="var(--baseline)" stroke-width="1" opacity="0"/>
      <g id="sc-hits">${hitDots}</g>
    </svg>
    <div class="scurve-tooltip" id="sc-tooltip"></div>`;

  const svg = document.getElementById('sc-svg');
  const crosshair = document.getElementById('sc-crosshair');
  const tooltip = document.getElementById('sc-tooltip');

  function showAt(i) {
    const w = planned[i]; const a = actual[i];
    crosshair.setAttribute('x1', x(i)); crosshair.setAttribute('x2', x(i)); crosshair.setAttribute('opacity','1');
    tooltip.innerHTML = '';
    const dateEl = document.createElement('div'); dateEl.className='scurve-tt-date';
    dateEl.textContent = `Minggu ${w.week} · ${fmtDateShort(w.start)}–${fmtDateShort(w.end)}`;
    tooltip.appendChild(dateEl);
    [['Rencana','var(--series-plan)', w.cumPct, w.cum], ['Aktual','var(--series-act)', a.pct, a.cum]].forEach(([name,color,pct,cum])=>{
      const row = document.createElement('div'); row.className='scurve-tt-row';
      const key = document.createElement('span'); key.className='scurve-tt-key'; key.style.background=color;
      const nameEl = document.createElement('span'); nameEl.className='scurve-tt-name'; nameEl.textContent = name;
      const val = document.createElement('span'); val.className='scurve-tt-val'; val.textContent = `${pct.toFixed(1)}% (${cum})`;
      row.appendChild(key); row.appendChild(nameEl); row.appendChild(val);
      tooltip.appendChild(row);
    });
    const left = (x(i)/W)*wrap.clientWidth;
    tooltip.style.left = left+'px';
    tooltip.style.top = (y(Math.max(w.cumPct,a.pct))/H*H)+'px';
    tooltip.classList.add('show');
  }
  function hide() { crosshair.setAttribute('opacity','0'); tooltip.classList.remove('show'); }

  svg.querySelectorAll('.sc-hit').forEach(dot => {
    const i = +dot.dataset.i;
    dot.addEventListener('pointerenter', ()=>showAt(i));
    dot.addEventListener('focus', ()=>showAt(i));
    dot.setAttribute('tabindex','0');
  });
  svg.addEventListener('pointerleave', hide);

  /* hero number */
  const hero = document.getElementById('sc-hero-num');
  const curActPct = actPct[n-1];
  const curPlanPct = planPct[n-1];
  hero.textContent = curActPct.toFixed(1)+'%';
  const delta = document.getElementById('sc-hero-delta');
  const diff = curActPct - curPlanPct;
  if (Math.abs(diff) < 0.05) {
    delta.textContent = 'Sesuai rencana';
    delta.style.color = 'var(--text-muted)';
  } else if (diff > 0) {
    delta.textContent = `+${diff.toFixed(1)}% di atas rencana`;
    delta.style.color = 'var(--green-600)';
  } else {
    delta.textContent = `${diff.toFixed(1)}% di bawah rencana`;
    delta.style.color = 'var(--red-800)';
  }
}

window.addEventListener('resize', renderSCurve);

renderStats();
renderTable();
renderSCurve();
</script>
</body>
</html>
